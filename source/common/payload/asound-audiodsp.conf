# AudioDSP shared four-channel playback path for CamillaDSP and short prompts.
# The prompt WAV files contain audio only in Front L/R; Rear L/R remain silent.
pcm.audiodsp_dmix {
    type dmix
    ipc_key 1196642126
    ipc_key_add_uid false
    ipc_perm 0660
    slave {
        pcm {
            type hw
            card U7
            device 0
        }
        format S24_3LE
        rate 48000
        channels 4
        period_size 1024
        buffer_size 8192
    }
    bindings {
        0 0
        1 1
        2 2
        3 3
    }
}

pcm.audiodsp_dsp {
    type plug
    slave.pcm "audiodsp_dmix"
}

pcm.audiodsp_announce {
    type plug
    slave.pcm "audiodsp_dmix"
}
